<title>MA-SHOP | Belleza y hogar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#F5F4F1;--ink:#14192B;--muted:#667085;--line:#E1E0DC;--forest:#16233F;--coral:#2F5D9B;--wa:#15803D;--card:#fff;--nav-h:calc(60px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5;padding-top:var(--nav-h);padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0;letter-spacing:-.02em}
.w{max-width:1160px;margin:0 auto;padding:0 20px}
.w2{max-width:1160px;margin:0 auto;padding:0 20px 14px}
.sr{position:absolute;left:-9999px}
.btn,button{border:0;border-radius:10px;padding:12px 20px;font:600 .95rem Inter,sans-serif;cursor:pointer;color:#fff;display:inline-block;text-align:center}
.wa{background:var(--wa)}.add{background:var(--ink)}.coral{background:var(--coral)}.pay{background:#0073B7}
nav{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(245,244,241,.62);-webkit-backdrop-filter:blur(10px) saturate(125%);backdrop-filter:blur(10px) saturate(125%);border-bottom:1px solid rgba(255,255,255,.6);box-shadow:0 4px 24px rgba(22,35,63,.08);padding-top:env(safe-area-inset-top,0px);transition:background .25s,border-color .25s,box-shadow .25s;--lg:#14192B;--lgo:#14192B}
nav.dark{background:rgba(24,38,68,.52);-webkit-backdrop-filter:blur(6px) saturate(110%);backdrop-filter:blur(6px) saturate(110%);border-bottom-color:rgba(255,255,255,.16);box-shadow:0 4px 20px rgba(0,0,0,.12);--lg:#FFFFFF;--lgo:#FFFFFF}
nav.scrolled{box-shadow:0 12px 32px rgba(22,35,63,.24),0 2px 8px rgba(22,35,63,.12)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{display:flex;align-items:center;gap:10px}
.logo .m{font:600 1.9rem/1 'Playfair Display',Georgia,serif;color:var(--lgo);transition:color .25s}
.logo .t{font:500 .72rem Inter,sans-serif;letter-spacing:.28em;color:var(--lgo);transition:color .25s}
.logo .sep{width:1px;height:28px;background:var(--lgo);transform:translateY(2px);margin:0 2px;transition:background .25s}
.menu{list-style:none;margin:0;padding:0;display:flex;gap:4px;align-items:center}
.menu>li{height:60px;display:flex;align-items:center}
.menu a.it{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;font-size:.84rem;font-weight:600;letter-spacing:.05em;white-space:nowrap;color:var(--lg);transition:color .25s,background .2s}
.car{font-size:.6rem;opacity:.7;transition:transform .25s}
.menu li.open .car{transform:rotate(180deg)}
.rt{display:flex;align-items:center;gap:10px}
#drop{max-height:0;opacity:0;overflow:hidden;pointer-events:none;transition:max-height .34s ease,opacity .28s ease;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(169,196,232,.32))}
nav.dropopen #drop{max-height:360px;opacity:1;pointer-events:auto}
nav.dark #drop{background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(110,150,225,.26))}
#drop .r{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 4px}
#drop .r:empty{display:none}
#drop .r+.r{border-top:1px solid rgba(110,118,135,.2);padding-top:12px}
.stepsrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:30px}
.sp,.card,.panel{position:relative;overflow:hidden;background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.85);box-shadow:0 10px 30px rgba(22,35,63,.10)}
.sp::before,.card::before,.panel::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 0%,rgba(169,196,232,.55),transparent 55%);pointer-events:none}
.sp>*,.card>*,.panel>*{position:relative}
.sp{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px}
.sp i{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--forest);color:#fff;font:700 .95rem 'Playfair Display',Georgia,serif;font-style:normal}
.sp span{font-size:.92rem;font-weight:500}
.blk{padding-top:44px}
.eyebrow{font:600 .8rem Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin-bottom:6px}
h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800}
.sub{color:var(--muted);margin:8px 0 22px;max-width:560px}
.more{font-weight:600;color:var(--coral)}
.back{display:inline-block;margin:26px 0 4px;font-weight:600;color:var(--coral)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{border-radius:18px;display:flex;flex-direction:column}
.panel{padding:24px;border-radius:18px;margin-bottom:18px}
.panel h3{font-size:1.05rem;margin:18px 0 6px}.panel h3:first-child{margin-top:0}
.panel .btn{margin:14px 10px 0 0}
.tile{height:120px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.tile small{align-self:flex-start;font-size:.75rem;font-weight:600;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tile b{font:800 1.5rem 'Playfair Display',Georgia,serif;letter-spacing:.02em}
.tile.img{height:180px;align-items:center;justify-content:center;padding:14px}
.tile.img img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(22,35,63,.25))}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{font-size:1.02rem;line-height:1.3;font-weight:600;flex:1}
.body .btn{text-align:center}
a.card .btn{align-self:flex-start}
.tt{font:700 1.15rem 'Playfair Display',Georgia,serif}.sm{font:400 .88rem Inter,sans-serif;color:var(--muted)}
.cod,.note,.fine{color:var(--muted)}.cod{font-size:.8rem}.note{font-size:.85rem}.fine{font-size:.76rem;margin:10px 0 0}
.price{font:800 1.25rem 'Playfair Display',Georgia,serif}
.aviso{font-size:.85rem;color:var(--muted);margin:6px 0 20px}
.pd{display:grid;grid-template-columns:1fr minmax(180px,290px);gap:28px;align-items:center}
.pimg{width:100%;height:auto;max-height:520px;object-fit:contain;filter:drop-shadow(0 14px 22px rgba(22,35,63,.22))}
.pricebox{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 4px}
.pricebox div{background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.95);border-radius:14px;padding:10px 18px;box-shadow:0 6px 18px rgba(22,35,63,.10)}
.pricebox small{display:block;color:var(--muted);font-size:.78rem;font-weight:600}
.pricebox b{font:800 1.5rem 'Playfair Display',Georgia,serif}
.code{display:inline-block;margin-top:12px;padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.7);border:1px dashed #9DB0CF}
.bank .eyebrow,.bank .back,.bank h2{color:var(--b1)}
.bank .panel{background:linear-gradient(135deg,var(--b0),rgba(255,255,255,.72) 75%)}
.bank .panel::before{background:radial-gradient(circle at 85% 0%,rgba(255,255,255,.7),transparent 55%)}
.bank .btn.coral{background:var(--b1)}
#msg{display:none;background:#E7F5EC;border:1px solid #B9DEC6;border-radius:12px;padding:14px;margin:20px 0 0}
#view{padding-bottom:64px}
footer{position:relative;overflow:hidden;z-index:2;margin-top:-28px;background:linear-gradient(135deg,rgba(28,62,128,.92),rgba(48,96,178,.86));-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border-top:1px solid rgba(255,255,255,.4);box-shadow:0 -14px 36px rgba(22,35,63,.24),0 -2px 8px rgba(22,35,63,.12);color:#EEF3FB;padding:44px 0 40px;text-align:center;font-size:.92rem}
footer::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 25%,rgba(169,196,232,.6),transparent 45%),radial-gradient(circle at 88% 75%,rgba(255,255,255,.28),transparent 40%);filter:blur(18px);pointer-events:none}
footer .w{position:relative}footer b{font-family:'Playfair Display',Georgia,serif;color:#fff;font-size:1.1rem}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);border-top:1px solid rgba(255,255,255,.7);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:none}
#bar .in{max-width:1160px;margin:0 auto}
#list{max-height:28vh;overflow:auto;font-size:.9rem;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:3px 0}
.row button{background:none;color:var(--coral);padding:2px 8px}
.tot{display:flex;justify-content:space-between;align-items:center;gap:12px}
@media(max-width:760px){.stepsrow{grid-template-columns:1fr;gap:8px}.sp{padding:10px 14px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.tile{height:96px;padding:12px}.body{padding:12px}.pd{grid-template-columns:1fr}.pimg{order:-1;max-width:230px;margin:0 auto}}
@media(max-width:900px){
:root{--nav-h:calc(100px + env(safe-area-inset-top,0px))}
nav .w{height:100px;flex-wrap:wrap;align-content:center;row-gap:4px}
nav .btn{padding:8px 14px}
.menu{order:3;width:100%;justify-content:space-between;gap:0}
.menu>li{height:40px;flex:1;justify-content:center}
.menu>li>a.it{justify-content:center;font-size:.8rem;letter-spacing:.03em;padding:8px 4px;width:100%}
}
.logo{display:block;height:44px;aspect-ratio:538/286}
.stepsrow{padding-top:22px}
@media(max-width:900px){.logo{height:40px}}
.menu>li>a.it:hover,.menu>li.open>a.it{box-shadow:inset 0 -2px 0 currentColor;border-radius:0}
#drop .r{justify-content:center;gap:2px 26px}
#drop .r a{display:inline-flex;align-items:center;gap:6px;padding:8px 2px;font-size:.95rem;font-weight:600;color:var(--lg);background:none;border:0;border-radius:0;border-bottom:2px solid transparent;transition:border-color .2s}
#drop .r a:hover,#drop .r a.on{border-bottom-color:currentColor}
.cover{position:relative;padding:34px 20px 78px}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,#fff 0%,#DCE8F7 52%,#CFDFF3 100%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 40%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,#000 40%,transparent 100%);pointer-events:none}
#coverslot{position:relative;width:min(400px,74vw);aspect-ratio:538/286;margin:0 auto}
#flogo{position:fixed;left:0;top:0;z-index:25;display:block;aspect-ratio:538/286;transform-origin:0 0;will-change:transform;visibility:hidden}

<script>
const $=id=>document.getElementById(id);
const money=n=>'$'+n.toLocaleString('es-MX')+' MXN';
const wa=(n,t)=>'https://wa.me/'+n+'?text='+encodeURIComponent(t);
const E=u=>u.replace(/&/g,'&amp;');
const COL={'Natura':['#FFE2CC','#B4500B'],'Avon':['#D9E6F8','#1D4F9A'],'Casa y Estilo':['#F6EEDC','#6F5B3A'],'Accesorios y más':['#E4E9F2','#2D3A55'],'Mercado Libre':['#FFF29A','#2D3277'],'Terminales Point':['#FFF29A','#2D3277'],'NU':['#E7D3FA','#5B1B9E'],'KLAR':['#CDEFE4','#0B6B5B'],'PLATA Card':['#FFDCCB','#C2410C'],'STORI':['#D3DFCE','#2F4A38'],'Mercado Pago':['#FFF29A','#2D3277'],'Representantes Point':['#FFF29A','#2D3277']};
const BANK={nu:'NU',klar:'KLAR',plata:'PLATA Card',stori:'STORI',mercadopago:'Mercado Pago',representantes:'Representantes Point'};
const BR={natura:'Natura',avon:'Avon',casa:'Casa y Estilo'};
const CARDS=['nu','klar','plata','stori','mercadopago'];
const MENU=[
 {t:'HOME',h:'#home'},
 {t:'TIENDA',h:'#tienda',c:[{t:'NATURA',h:'#natura'},{t:'AVON',h:'#avon'},{t:'Casa y Estilo',h:'#casa'},{t:'Accesorios y más',h:'#accesorios'}]},
 {t:'MÁS',h:'#mas',c:[
  {t:'Mercado Libre',h:'#mercadolibre',c:[{t:'Terminales Point',h:'#point'},{t:'Representantes Point',h:'#representantes'}]},
  {t:'Únete',h:'#unete',c:[{t:'NU',h:'#nu'},{t:'KLAR',h:'#klar'},{t:'PLATA Card',h:'#plata'},{t:'STORI',h:'#stori'},{t:'Mercado Pago',h:'#mercadopago'}]}]}
];
let catalog=[],cart={},CFG={},TXT={},WA='',CUR=(location.hash||'#home').slice(1)||'home',TOP=-1,SUB=-1;
const NAV=document.querySelector('nav'),V=$('view');
const BG='radial-gradient(circle at 88% 12%,rgba(255,255,255,.75),transparent 55%)';
const head=(t,e,s)=>`<div class="eyebrow">${e}</div><h2>${t}</h2>${s?`<p class="sub">${s}</p>`:''}`;
const back=(h,l)=>`<a class="back" href="${h}">← ${l}</a>`;
const tiles=a=>`<div class="grid">${a.map(i=>{const c=COL[i.t]||['#DCE6F2','#1E4E8C'];return `<a class="card" href="${i.h}"><div class="tile${i.photo?' photo':i.img?' img':''}" style="background:${BG},linear-gradient(135deg,${c[0]},#fff 160%);color:${c[1]}">${i.img?`<img src="${i.img}" alt="${i.t}" loading="lazy">`:`<small>${i.g||''}</small><b>${i.t}</b>`}</div><div class="body"><h3>${i.img?`<span class="tt">${i.t}</span><br>`:''}${i.d}</h3><span class="btn add">Ver más</span></div></a>`}).join('')}</div>`;
function prodCard(p){
  const c=COL[p.marca]||['#DCE6F2','#1E4E8C'];
  const act=p.precio>0?`<div class="price">${money(p.precio)}</div><button class="add" data-add="${p.id}">Agregar al carrito</button>`:`<div class="note">Precio de la campaña</div><a class="btn wa" data-wa="Hola, quiero el precio de: ${p.nombre}${p.codigo?' (código '+p.codigo+')':''}">Consultar precio</a>`;
  return `<div class="card"><div class="tile" style="background:${BG},linear-gradient(135deg,${c[0]},#fff 160%);color:${c[1]}"><small>${p.categoria}</small><b>${p.marca}</b></div><div class="body"><h3>${p.nombre}</h3>${p.codigo?`<div class="cod">Código ${p.codigo}</div>`:''}${act}</div></div>`;
}
const grid=(l,e)=>l.length?`<div class="grid">${l.map(prodCard).join('')}</div>`:`<div class="panel"><p>${e}</p><a class="btn wa" data-wa="Hola, busco un producto y quiero información">Escríbeme por WhatsApp</a></div>`;
const catBtn=m=>{const c=(CFG.catalogos||[]).find(x=>x.marca===m);return c?`<a class="btn add" target="_blank" rel="noopener" ${c.url?'download':''} href="${c.url||wa(WA,'Hola, ¿me compartes el catálogo completo de '+c.marca+'?')}">${c.marca} ${c.campana}: ${c.url?'descargar PDF':'pedir catálogo'}</a>`:''};
const brand=k=>{const m=BR[k];return back('#tienda','Tienda')+head(m,'Tienda','Las líneas que siempre tenemos. El precio depende de la campaña: pregúntalo y te respondo al momento.')+grid(catalog.filter(p=>p.marca===m),'Pronto agregaré productos aquí.')+`<div class="panel" style="margin-top:22px"><h3>Más información</h3><p>Para más información o para ver el catálogo completo de ${m}:</p>${catBtn(m)}<a class="btn wa" data-wa="Hola, quiero más información de ${m}">Escríbeme por WhatsApp</a></div>`};
const buy=k=>{const d=TXT[k];return d.url?`href="${E(d.url)}" target="_blank" rel="noopener sponsored"`:`data-wa="Hola, quiero comprar: ${d.titulo}"`};
function detail(k){
  const d=TXT[k],isP=k.startsWith('point-');
  const par=CARDS.includes(k)?['#unete','Únete']:isP?['#point','Terminales Point']:k==='mercadolibre'?['#mas','Más']:k==='representantes'?['#mercadolibre','Mercado Libre']:['#mas','Más'];
  const pre=d.precio?`<div class="pricebox"><div><small>${d.precio_etiqueta||'Precio'}</small><b>${d.precio}</b></div>${d.precio2?`<div><small>${d.precio2_etiqueta||''}</small><b>${d.precio2}</b></div>`:''}</div>`:'';
  const img=d.imagen?`<img class="pimg" src="${d.imagen}" alt="${d.titulo}">`:'';
  const ben=(d.beneficios||[]).length?`<h3>Beneficios</h3><ul>${d.beneficios.map(x=>`<li>${x}</li>`).join('')}</ul>`:'';
  const btn=isP?`<a class="btn coral" ${buy(k)}>Comprar</a>`:d.url?`<a class="btn coral" href="${E(d.url)}" target="_blank" rel="noopener sponsored">${d.boton||'Ir al enlace'}</a>`:`<a class="btn wa" data-wa="Hola, me interesa: ${d.titulo}">Pedir información por WhatsApp</a>`;
  const c=COL[BANK[k]]||['#DCE6F2','#1E4E8C'];
  return `<div class="bank" style="--b0:${c[0]};--b1:${c[1]}">${back(par[0],par[1])}${head(d.titulo,par[1],d.intro)}<div class="panel"><div class="pd"><div>${d.como?`<h3>Cómo funciona</h3><p>${d.como}</p>`:''}${ben}${d.codigo?`<div class="code">Mi código de referido: <b>${d.codigo}</b></div><br>`:''}${pre}${btn}${isP?`<p class="fine">Se aplican comisiones por transacción.</p>`:''}${!isP&&d.nota?`<p class="note">${d.nota}</p>`:''}</div>${img}</div></div>${CARDS.includes(k)?`<p class="aviso">${TXT.aviso_unete}</p>`:''}</div>`;
}
const imgTile=(k,t,hh,d)=>({t,h:hh,d,img:(TXT[k]||{}).imagen});
const buyEl=(k,cls)=>{const p=catalog.find(x=>x.id===k);return p&&p.precio>0?`<button class="${cls||'btn coral'}" data-add="${k}">Comprar</button>`:`<a class="${cls||'btn coral'}" data-wa="Hola, quiero comprar: ${TXT[k].titulo}">Comprar</a>`};
const storeTiles=()=>tiles([{t:'Natura',h:'#natura',d:'Cuidado de la piel, cuerpo y perfumería.',img:'img/natura.webp',photo:1},{t:'Avon',h:'#avon',d:'Fragancias, maquillaje y cuidado personal.',img:'img/avon.webp',photo:1},{t:'Casa y Estilo',h:'#casa',d:'Cocina, blancos, organizadores y niñez.',img:'img/casa.webp',photo:1},{t:'Accesorios y más',g:'Variedad',h:'#accesorios',d:'Accesorios, gadgets y más.'}]);
const mlBlock=()=>{const d=TXT.mercadolibre;return `<div class="panel"><p>${d.intro}</p>${d.url?`<a class="btn coral" href="${E(d.url)}" target="_blank" rel="noopener sponsored">${d.boton}</a>`:`<a class="btn wa" data-wa="Hola, quiero ver tus productos de Mercado Libre">Preguntar por WhatsApp</a>`}${d.nota?`<p class="note">${d.nota}</p>`:''}</div>`};
const accBlock=()=>grid(catalog.filter(p=>!Object.values(BR).includes(p.marca)&&p.marca!=='Terminales Point'),'Pronto agregaré aquí accesorios, gadgets y más. Escríbeme si buscas algo en especial.');
const pTile=(k,big)=>{const d=TXT[k];return `<div class="card"><div class="tile img" style="background:${BG},linear-gradient(135deg,#FFF29A,#fff 160%)"><img src="${d.imagen}" alt="${d.titulo}" loading="lazy"></div><div class="body"><h3><span class="tt">${d.titulo}</span><br><span class="sm">${big?d.intro:d.corta}</span></h3>${big?`<div class="pricebox" style="margin:6px 0"><div><small>Precio</small><b>${d.precio}</b></div></div><div class="note">${d.msi}</div>`:''}${buyEl(k)}<a class="more" href="#${k}" style="text-align:center;margin-top:6px">Ver más</a></div></div>`};
const pointBlock=()=>`<div class="grid">${pTile('point-smart-2')}${pTile('point-mini')}</div>`;
const pointOverview=()=>`<div class="grid">${pTile('point-smart-2',1)}${pTile('point-mini',1)}</div>`;
const sc=(t,b)=>`<div class="panel"><h3>${t}</h3>${b}</div>`;
function pointDetail(k){
  const d=TXT[k],I=TXT.point_info,idx=k==='point-smart-2'?1:2;
  const hero=`<div class="panel"><div class="pd"><div><p style="margin-top:0">${d.intro}</p><div class="pricebox"><div><small>Precio</small><b>${d.precio}</b></div></div><p class="note">${d.msi}</p>${buyEl(k)}</div><img class="pimg" src="${d.imagen}" alt="${d.titulo}"></div></div>`;
  return `<div class="bank" style="--b0:#FFF29A;--b1:#2D3277">${back('#point','Terminales Point')}${head(d.titulo,'Terminales Point','')}${hero}`
   +sc('Ficha técnica',`<div class="tscroll"><table>${d.ficha.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>`)
   +sc('Funciones principales',`<ul>${d.funciones.map(x=>`<li>${x}</li>`).join('')}</ul>`)
   +sc('Contenido del paquete',`<p>${d.paquete}</p>`)
   +sc('Comisiones y costos',`<p>${d.comisiones}</p>`)
   +sc('¿A qué negocios se la recomiendo?',`<ul>${d.ideal.map(x=>`<li>${x}</li>`).join('')}</ul>`)
   +sc('Comparativa rápida',`<div class="tscroll"><table><tr><th></th><th>Point Smart 2</th><th>Point Mini</th></tr>${I.comparativa.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div><p class="note" style="margin-top:12px">${I.regla}</p>`)
   +sc('Preguntas frecuentes',I.faq.map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join(''))
   +`<p class="fine">${I.aviso}</p></div>`;
}
const uneteBlock=()=>tiles(CARDS.map(k=>imgTile(k,TXT[k].titulo,'#'+k,TXT[k].intro)))+`<p class="aviso" style="margin-top:14px">${TXT.aviso_unete}</p>`;
const sec=(t,e,s,hh,body)=>`<div class="blk">${head(t,e,s)}${body}<p style="margin-top:16px"><a class="more" href="${hh}">Ver más →</a></p></div>`;
const VIEWS={
 home:()=>sec('Tienda','Tienda','Natura, Avon, Casa y Estilo y más.','#tienda',storeTiles())+sec('Mercado Libre','Más','','#mercadolibre',mlBlock())+sec('Terminales Point','Más','Terminales de Mercado Pago para cobrar con tarjeta.','#point',pointBlock())+sec('Únete','Más','Solicita tu tarjeta o cuenta con mi enlace de referido.','#unete',uneteBlock()),
 tienda:()=>head('Tienda','Tienda','Elige una sección.')+storeTiles(),
 natura:()=>brand('natura'),avon:()=>brand('avon'),casa:()=>brand('casa'),
 accesorios:()=>back('#tienda','Tienda')+head('Accesorios y más','Tienda','Accesorios, gadgets y más.')+accBlock(),
 mas:()=>head('Más','Más','Mercado Libre, terminales y formas de ganar.')+tiles([{t:'Mercado Libre',g:'Tienda',h:'#mercadolibre',d:'Mi tienda, terminales Point y representantes.'},{t:'Únete',g:'Tarjetas y más',h:'#unete',d:'Solicita tu tarjeta o cuenta con mi enlace de referido.'}]),
 mercadolibre:()=>back('#mas','Más')+head('Mercado Libre','Más','')+mlBlock()+tiles([imgTile('point-smart-2','Terminales Point','#point','Point Smart 2 y Point Mini.'),{t:'Representantes Point',g:'Programa',h:'#representantes',d:'Conviértete en representante.'}]),
 point:()=>back('#mercadolibre','Mercado Libre')+head('Terminales Point','Mercado Libre','Elige la que mejor se adapte a tu negocio.')+pointOverview(),
 unete:()=>back('#mas','Más')+head('Únete','Más','Conoce cómo funcionan y solicita la tuya con mi enlace de referido.')+uneteBlock()
};
const tabHtml=(m,i)=>`<li><a class="it" href="${m.h}" data-top="${m.c?i:''}">${m.t}${m.c?'<span class="car">▾</span>':''}</a></li>`;
function renderDrop(){
  const m=MENU[TOP];if(!m||!m.c){closeDrop();return}
  const s=m.c[SUB];
  $('r1').innerHTML=m.c.map((x,i)=>`<a class="${i===SUB?'on':''}" href="${x.h}" data-sub="${x.c?i:''}">${x.t}${x.c?' <span class="car">▾</span>':''}</a>`).join('');
  $('r2').innerHTML=s&&s.c?s.c.map(y=>`<a href="${y.h}">${y.t}</a>`).join(''):'';
  NAV.classList.add('dropopen');
  document.querySelectorAll('.menu li').forEach((l,i)=>l.classList.toggle('open',i===TOP));
}
function closeDrop(){TOP=-1;SUB=-1;NAV.classList.remove('dropopen');document.querySelectorAll('.menu li').forEach(l=>l.classList.remove('open'))}
function go(hh){CUR=hh.replace('#','')||'home';try{history.pushState(null,'',hh)}catch(e){}route()}
function route(){
  const k=CUR||'home';
  document.querySelectorAll('.homeonly').forEach(e=>e.style.display=k==='home'?'':'none');
  V.innerHTML=VIEWS[k]?VIEWS[k]():(k==='point-smart-2'||k==='point-mini')?pointDetail(k):TXT[k]?detail(k):VIEWS.home();
  document.querySelectorAll('[data-wa]').forEach(a=>{a.href=wa(WA,a.dataset.wa);a.target='_blank';a.rel='noopener'});
  geom();closeDrop();scrollTo(0,0);navTone();
}
function renderCart(){
  const ids=Object.keys(cart);let t=0;
  $('bar').style.display=ids.length?'block':'none';
  $('list').innerHTML=ids.map(id=>{const p=catalog.find(x=>x.id===id);t+=p.precio*cart[id];return `<div class="row"><span>${cart[id]} × ${p.nombre}</span><span>${money(p.precio*cart[id])} <button data-del="${id}">Quitar</button></span></div>`}).join('');
  $('total').textContent='Total: '+money(t);
}
async function init(){
  const [cfg,txt]=await Promise.all([fetch('/api/config').then(r=>r.json()),fetch('/contenido.json').then(r=>r.json())]);
  CFG=cfg;TXT=txt;catalog=cfg.products;WA=cfg.whatsapp;
  $('menu').innerHTML=MENU.map(tabHtml).join('');
  const r=new URLSearchParams(location.search).get('pago');
  const T={ok:'¡Pago recibido! Gracias por tu compra, te contactaremos para la entrega.',pendiente:'Tu pago está pendiente de confirmarse.',error:'El pago no se completó. Puedes intentarlo de nuevo.'};
  if(T[r]){$('msg').style.display='block';$('msg').textContent=T[r]}
  route();
}
addEventListener('popstate',()=>{CUR=(location.hash||'#home').slice(1)||'home';route()});
NAV.addEventListener('mouseover',e=>{if(!matchMedia('(hover:hover)').matches)return;const a=e.target.closest&&e.target.closest('a[data-top]');if(!a)return;if(a.dataset.top===''){closeDrop();return}const i=+a.dataset.top;if(TOP!==i){TOP=i;SUB=-1;renderDrop()}});
NAV.addEventListener('mouseleave',()=>{if(matchMedia('(hover:hover)').matches)closeDrop()});
document.addEventListener('click',async e=>{
  const t=e.target;
  const hov=matchMedia('(hover:hover)').matches;
  const at=t.closest&&t.closest('a[data-top]'),as=t.closest&&t.closest('#drop a[data-sub]'),al=t.closest&&t.closest('a[href^="#"]');
  if(at&&at.dataset.top!==''){e.preventDefault();const i=+at.dataset.top;if(TOP===i&&!hov)closeDrop();else if(TOP!==i){TOP=i;SUB=-1;renderDrop()}return}
  if(as&&as.dataset.sub!==''){e.preventDefault();const j=+as.dataset.sub;SUB=SUB===j?-1:j;renderDrop();return}
  if(al){e.preventDefault();go(al.getAttribute('href'));return}
  if(!(t.closest&&t.closest('nav')))closeDrop();
  if(t.dataset.add){cart[t.dataset.add]=(cart[t.dataset.add]||0)+1;renderCart()}
  if(t.dataset.del){delete cart[t.dataset.del];renderCart()}
  if(t.id==='payBtn'){
    t.disabled=true;t.textContent='Conectando...';
    try{
      const res=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:Object.keys(cart).map(id=>({id,qty:cart[id]}))})});
      const d=await res.json();
      if(d.url)location.href=d.url;else throw new Error(d.error);
    }catch(err){alert('No se pudo iniciar el pago. Intenta de nuevo.');t.disabled=false;t.textContent='Pagar con Mercado Pago'}
  }
});
let G=null;
const FL=$('flogo');
function geom(){
  const L=NAV.querySelector('.logo');if(!L)return;
  const e=L.getBoundingClientRect(),s=$('coverslot'),home=!!(s&&s.offsetParent);
  if(home){const r=s.getBoundingClientRect();G={home:true,sx:r.left,sy:r.top+scrollY,sw:r.width,ex:e.left,ey:e.top,ew:e.width}}
  else G={home:false,sx:e.left,sy:e.top,sw:e.width,ex:e.left,ey:e.top,ew:e.width};
}
const sstep=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
function logoTick(){
  if(!G)geom();if(!G||!FL)return;
  const p=G.home?Math.min(1,Math.max(0,scrollY/320)):1,e=p*p*(3-2*p);
  const x=G.sx+(G.ex-G.sx)*e,y=G.sy+(G.ey-G.sy)*e,w=G.sw+(G.ew-G.sw)*e;
  FL.style.width=G.sw+'px';FL.style.transform='translate3d('+x+'px,'+y+'px,0) scale('+(w/G.sw)+')';FL.style.visibility='visible';
  const f=sstep(.35,.75,p);FL.querySelector('.big').style.opacity=1-f;FL.querySelector('.sm').style.opacity=f;
  FL.classList.toggle('white',NAV.classList.contains('dark')&&p>.9);
}
function navTone(){const h=NAV.offsetHeight;NAV.classList.toggle('scrolled',scrollY>8);NAV.classList.toggle('dark',scrollY>8&&[...document.querySelectorAll('.dz')].some(e=>{const r=e.getBoundingClientRect();return r.top<h&&r.bottom>h}));logoTick()}
addEventListener('scroll',()=>requestAnimationFrame(navTone),{passive:true});addEventListener('resize',()=>{geom();navTone()});
init();
</script>
</body>
</html>
